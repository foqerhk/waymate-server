services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waymate
      POSTGRES_PASSWORD: waymate
      POSTGRES_DB: waymate
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - waymate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waymate -d waymate"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit.yaml
    ports:
      # Signaling via nginx on prod; RTC media must be public
      - "127.0.0.1:17880:7880"
      - "0.0.0.0:7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  api:
    build: .
    ports:
      - "127.0.0.1:18080:8080"
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://waymate:waymate@db:5432/waymate?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-replace-with-long-random-production-secret}
      INVITE_HMAC_SECRET: ${INVITE_HMAC_SECRET:-replace-with-long-random-invite-secret}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:18080}
      INVITE_TTL: ${INVITE_TTL:-24h}
      APNS_ENABLED: ${APNS_ENABLED:-false}
      APNS_KEY_PATH: ${APNS_KEY_PATH:-/app/secrets/AuthKey_XXXXXXXXXX.p8}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.example.waymate}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      MIGRATION_DIR: /app/migrations
      # Inside compose network; public URL is for iOS clients
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-replace-with-livekit-secret}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://127.0.0.1:17880}
      MAPS_PROVIDER: ${MAPS_PROVIDER:-amap}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      AMAP_WEB_KEYS: ${AMAP_WEB_KEYS:-}
      AMAP_SEARCH_MONTHLY_QUOTA: ${AMAP_SEARCH_MONTHLY_QUOTA:-5000}
      AMAP_LBS_MONTHLY_QUOTA: ${AMAP_LBS_MONTHLY_QUOTA:-150000}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_API_KEYS: ${GOOGLE_MAPS_API_KEYS:-}
      GOOGLE_SEARCH_MONTHLY_QUOTA: ${GOOGLE_SEARCH_MONTHLY_QUOTA:-}
      GOOGLE_LBS_MONTHLY_QUOTA: ${GOOGLE_LBS_MONTHLY_QUOTA:-}
      CAPACITY_MAX_VOICE_CALLS: ${CAPACITY_MAX_VOICE_CALLS:-30}
      CAPACITY_MAX_VIDEO_CALLS: ${CAPACITY_MAX_VIDEO_CALLS:-8}
      CAPACITY_VIDEO_WEIGHT: ${CAPACITY_VIDEO_WEIGHT:-3}
      MAPS_CALLS_PER_FAMILY_DAY: ${MAPS_CALLS_PER_FAMILY_DAY:-20}
      PEAK_CALL_FRACTION_PCT: ${PEAK_CALL_FRACTION_PCT:-2}
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started

volumes:
  waymate_pg:
