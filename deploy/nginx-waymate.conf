# WayMate API + LiveKit on waymate.intentcomputing.cn
# API: /v1 /healthz — LiveKit: /rtc /twirp (WSS)

server {
    listen 80;
    listen [::]:80;
    server_name waymate.intentcomputing.cn;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name waymate.intentcomputing.cn;

    ssl_certificate /etc/letsencrypt/live/waymate.intentcomputing.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waymate.intentcomputing.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    # --- WayMate API ---
    location = /healthz {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- LiveKit SFU (signaling over WSS; media UDP 50000-50100) ---
    location /rtc {
        proxy_pass http://127.0.0.1:17880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /twirp {
        proxy_pass http://127.0.0.1:17880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Marketing site + status panel
    location /assets/ {
        alias /opt/waymate/web/assets/;
        expires 1h;
        add_header Cache-Control "public";
    }
    location = /status {
        return 301 /status/;
    }
    location /status/ {
        alias /opt/waymate/web/status/;
        try_files $uri $uri/ /status/index.html;
    }
    location / {
        root /opt/waymate/web;
        try_files $uri $uri/ /index.html;
    }
}
