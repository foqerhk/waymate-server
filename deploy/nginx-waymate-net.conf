# WayMate API + LiveKit on waymate.intentcomputing.net (intl)
# API: /v1 /healthz — LiveKit: /rtc /twirp (WSS)
# Note: LiveKit UDP media (50000-50100) must hit origin directly — keep Cloudflare DNS-only (grey cloud).

server {
    listen 80;
    listen [::]:80;
    server_name waymate.intentcomputing.net;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name waymate.intentcomputing.net;

    ssl_certificate /etc/letsencrypt/live/waymate.intentcomputing.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waymate.intentcomputing.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    location = /healthz {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /rtc {
        proxy_pass http://127.0.0.1:17880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /twirp {
        proxy_pass http://127.0.0.1:17880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        alias /opt/waymate/web/assets/;
        expires 1h;
        add_header Cache-Control "public";
    }
    location = /status {
        return 301 /status/;
    }
    location /status/ {
        alias /opt/waymate/web/status/;
        try_files $uri $uri/ /status/index.html;
    }
    location / {
        root /opt/waymate/web;
        try_files $uri $uri/ /index.html;
    }
}
